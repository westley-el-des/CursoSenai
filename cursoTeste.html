<!DOCTYPE html>
    <html>
      <head>
        <meta charset="utf-8">

        <style>
            input:invalid{
                border: 2px dashed red;
            }
            input:valid{
                border: 2px solid green;
            }
        </style>

        <script>
            var verify_form = () => {
            return confirm("Formulário está OK?");
            }
        </script>
      </head>

      <body>
        <form onsubmit="verify_form()">
          Campo obrigatório 1:
          <input type="text" size="40" required>
          <br><br>
          Campo obrigatório 2:
          <input type="text" size="40" required>
          <br><br>
          <input type="submit" value="Enviar">
        </form>

        <form onsubmit="verify_form()">
                  Digite um endereço de email:
                  <input type="email" size="40" required>
                  <br><br>
                  <input type="submit" value="Enviar">
               </form>
        
        <form onsubmit="verify_form()">
              Campo numérico com restrição:
              <input type="number" min="0" max="10" step="2" value="0" required>
              <br><br>
              <input type="submit" value="Enviar">
            </form>
        
        <form onsubmit="verify_form()">
                Digite uma vogal:
                <input type="text" size="15" maxlength="1" pattern="A|E|I|O|U|a|e|i|o|u" required>
                <br><br>
                <input type="submit" value="Enviar">
            </form>
            
    
        
      </body>
    </html>
